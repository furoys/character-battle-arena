openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: characters
    description: Character management
  - name: fights
    description: Fight simulation
  - name: me
    description: Signed-in user operations
  - name: tournaments
    description: Single-elimination tournament brackets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List all characters
      responses:
        "200":
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
    post:
      operationId: createCharacter
      tags: [characters]
      summary: Create a new character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterBody"
      responses:
        "201":
          description: Created character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{id}:
    get:
      operationId: getCharacter
      tags: [characters]
      summary: Get a character by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCharacter
      tags: [characters]
      summary: Delete a character
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/stats/summary:
    get:
      operationId: getCharacterStats
      tags: [characters]
      summary: Get character roster stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterStatsSummary"

  /fights:
    get:
      operationId: listFights
      tags: [fights]
      summary: List recent fights
      responses:
        "200":
          description: List of fight records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FightRecord"
    post:
      operationId: simulateFight
      tags: [fights]
      summary: Simulate a fight between two teams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateFightBody"
      responses:
        "200":
          description: Fight result with round-by-round narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FightResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearFightHistory
      tags: [fights]
      summary: Delete all fight records
      responses:
        "204":
          description: Fight history cleared

  /fights/{id}:
    get:
      operationId: getFight
      tags: [fights]
      summary: Get a single fight by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full fight record with rounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FightDetail"
        "404":
          description: Fight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFight
      tags: [fights]
      summary: Delete a single fight record by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Fight deleted
        "404":
          description: Fight not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/teams:
    get:
      operationId: listSavedTeams
      tags: [me]
      summary: List saved teams for the signed-in user
      responses:
        "200":
          description: List of saved teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedTeam"
        "401":
          description: Not signed in
    post:
      operationId: saveTeam
      tags: [me]
      summary: Save a team composition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTeamBody"
      responses:
        "200":
          description: Saved team record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedTeam"
        "401":
          description: Not signed in

  /me/teams/{id}:
    delete:
      operationId: deleteSavedTeam
      tags: [me]
      summary: Delete a saved team
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Team deleted
        "401":
          description: Not signed in
        "404":
          description: Team not found or not owned by user

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List recent tournaments (community feed)
      responses:
        "200":
          description: Recent tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentSummary"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create and auto-run a tournament bracket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Completed tournament with full bracket and champion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Character:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        universe:
          type: string
        strength:
          type: integer
          description: "1-100"
        speed:
          type: integer
          description: "1-100"
        intelligence:
          type: integer
          description: "1-100"
        durability:
          type: integer
          description: "1-100"
        specialAbility:
          type: string
        weaknesses:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        behaviorTags:
          type: array
          nullable: true
          items:
            type: string
          description: "Tags describing the character's combat behavior / archetype"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - universe
        - strength
        - speed
        - intelligence
        - durability
        - specialAbility
        - weaknesses
        - description
        - createdAt

    CreateCharacterBody:
      type: object
      properties:
        name:
          type: string
        universe:
          type: string
        strength:
          type: integer
          minimum: 1
          maximum: 100
        speed:
          type: integer
          minimum: 1
          maximum: 100
        intelligence:
          type: integer
          minimum: 1
          maximum: 100
        durability:
          type: integer
          minimum: 1
          maximum: 100
        specialAbility:
          type: string
        weaknesses:
          type: string
        description:
          type: string
      required:
        - name
        - universe
        - strength
        - speed
        - intelligence
        - durability
        - specialAbility
        - weaknesses
        - description

    CharacterStatsSummary:
      type: object
      properties:
        totalCharacters:
          type: integer
        topStrength:
          $ref: "#/components/schemas/Character"
        topSpeed:
          $ref: "#/components/schemas/Character"
        topIntelligence:
          $ref: "#/components/schemas/Character"
        universeBreakdown:
          type: array
          items:
            type: object
            properties:
              universe:
                type: string
              count:
                type: integer
            required:
              - universe
              - count
      required:
        - totalCharacters
        - universeBreakdown

    SimulateFightBody:
      type: object
      properties:
        team1:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 5
        team2:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 5
        mode:
          type: string
          enum:
            - cinematic
            - brutal
            - realistic
            - fun
            - debate
          default: realistic
          description: "Tone of the fight. realistic = strict stat-driven logic, no chaos (default). cinematic = epic theatrical. brutal = grounded, vicious, bone-snap physicality. (fun/debate accepted as legacy aliases of cinematic/realistic.)"
        upset:
          type: boolean
          default: false
          description: "Override the cached verdict and let the underdog win. Bypasses verdict cache."
        challengeCode:
          type: string
          description: "When set, this fight is part of a PvP challenge. The first caller generates the fight; subsequent callers (the other player) wait and replay the SAME saved narrative so both players see identical text."
        modifierId:
          type: string
          nullable: true
          description: "Optional chaos modifier id (e.g. 'lava_floor', 'underdog'). Validated against the server registry; unknown values are ignored. When a challengeCode is also provided the challenge's stored modifierId wins."
        dailyMatchupId:
          type: string
          nullable: true
          description: "When set, marks this fight as a daily-matchup viewing. Server verifies the id matches today's lineup AND the teams match the matchup's roster before bypassing the energy gate. Daily-matchup fights are free — they don't consume energy."
      required:
        - team1
        - team2

    FightRound:
      type: object
      properties:
        round:
          type: integer
        attacker:
          type: string
        defender:
          type: string
        attackType:
          type: string
        narrative:
          type: string
        team1Hp:
          type: number
        team2Hp:
          type: number
      required:
        - round
        - attacker
        - defender
        - attackType
        - narrative
        - team1Hp
        - team2Hp

    FightResult:
      type: object
      properties:
        id:
          type: integer
        team1:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        team2:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        winner:
          type: integer
          description: "1 or 2 indicating which team won"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/FightRound"
        summary:
          type: string
        arenaIntro:
          type: string
          description: "AI-generated arena description shown before the fight begins"
        intro:
          type: string
          description: "AI-generated combatant entrance section shown after the setting"
        whyWon:
          type: array
          items:
            type: string
          description: "AI-generated array of reasons why the winner won (5 sentences)"
        settled:
          type: boolean
          description: "True once the Stage-1 winner verdict is locked in (used to gate the cinematic phase)"
        winRate:
          type: integer
          description: "Estimated win rate (50-100) of the winning team in this matchup"
        rematchCount:
          type: integer
          description: "How many times this exact matchup has been simulated"
        modifierId:
          type: string
          nullable: true
          description: "Chaos modifier active for this fight, if any (e.g. 'lava_floor')"
        simulatedAt:
          type: string
          format: date-time
      required:
        - id
        - team1
        - team2
        - winner
        - rounds
        - summary
        - simulatedAt

    FightDetail:
      type: object
      properties:
        id:
          type: integer
        team1Names:
          type: array
          items:
            type: string
        team2Names:
          type: array
          items:
            type: string
        winner:
          type: integer
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/FightRound"
        summary:
          type: string
        arenaIntro:
          type: string
        intro:
          type: string
        modifierId:
          type: string
          nullable: true
          description: "Chaos modifier active for this fight, if any"
        simulatedAt:
          type: string
          format: date-time
      required:
        - id
        - team1Names
        - team2Names
        - winner
        - rounds
        - summary
        - simulatedAt

    FightRecord:
      type: object
      properties:
        id:
          type: integer
        team1Names:
          type: array
          items:
            type: string
        team2Names:
          type: array
          items:
            type: string
        winner:
          type: integer
        summary:
          type: string
        modifierId:
          type: string
          nullable: true
          description: "Chaos modifier active for this fight, if any"
        simulatedAt:
          type: string
          format: date-time
      required:
        - id
        - team1Names
        - team2Names
        - winner
        - summary
        - simulatedAt

    SavedTeam:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        characterIds:
          type: array
          items:
            type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - characterIds
        - createdAt

    SaveTeamBody:
      type: object
      properties:
        name:
          type: string
        characterIds:
          type: array
          items:
            type: integer
      required:
        - name
        - characterIds

    TournamentCompetitor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        universe:
          type: string
        imageUrl:
          type: string
          nullable: true
      required:
        - id
        - name
        - universe
        - imageUrl

    TournamentMatch:
      type: object
      properties:
        matchId:
          type: string
        a:
          $ref: "#/components/schemas/TournamentCompetitor"
          nullable: true
        b:
          $ref: "#/components/schemas/TournamentCompetitor"
          nullable: true
        winnerSide:
          type: integer
          nullable: true
          description: "1 if competitor a won, 2 if competitor b won, null for a bye"
        winnerId:
          type: integer
          nullable: true
        difficulty:
          type: string
          nullable: true
          description: "easy | moderate | hard"
        fightType:
          type: string
          nullable: true
          description: "stomp | one-sided | close"
        blurb:
          type: string
          nullable: true
          description: "Short win-condition / turning point line"
      required:
        - matchId
        - a
        - b
        - winnerSide
        - winnerId
        - difficulty
        - fightType
        - blurb

    TournamentRound:
      type: object
      properties:
        name:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/TournamentMatch"
      required:
        - name
        - matches

    TournamentBracket:
      type: object
      properties:
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/TournamentRound"
      required:
        - rounds

    Tournament:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
          nullable: true
        name:
          type: string
        themeLabel:
          type: string
          nullable: true
        size:
          type: integer
        championId:
          type: integer
        championName:
          type: string
        bracket:
          $ref: "#/components/schemas/TournamentBracket"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - themeLabel
        - size
        - championId
        - championName
        - bracket
        - createdAt

    TournamentSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        themeLabel:
          type: string
          nullable: true
        size:
          type: integer
        championId:
          type: integer
        championName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - themeLabel
        - size
        - championId
        - championName
        - createdAt

    TournamentInput:
      type: object
      properties:
        size:
          type: integer
          enum: [8, 16]
          description: "Number of competitors in the bracket"
        name:
          type: string
          description: "Display name for the tournament"
        themeLabel:
          type: string
          nullable: true
          description: "Optional themed-cup label"
        competitorIds:
          type: array
          maxItems: 16
          items:
            type: integer
          description: "Seeded competitor character ids (in seed order). Fewer than size will be topped up with random characters. Capped at the largest bracket size (16)."
      required:
        - size
        - competitorIds
