kind = "web"
previewPath = "/"
title = "A.v.A — Anyone vs Anyone"
version = "1.0.0"
id = "artifacts/fight-club"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21528

[services.development]
run = "pnpm --filter @workspace/fight-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fight-club", "run", "build" ]
publicDir = "artifacts/fight-club/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21528"
BASE_PATH = "/"
